[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-agentic-rag"
version = "1.0.0"
description = "Secure, observable, service-oriented Agentic RAG platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.110.0",
  "uvicorn[standard]==0.29.0",
  "pydantic==2.6.4",
  "openai==1.16.2",
  "httpx>=0.27,<0.28",
  "prometheus-client>=0.20,<1.0",
  "python-multipart>=0.0.9",
  "structlog>=24.1,<26",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
postgres = ["psycopg[binary,pool]>=3.1"]
redis = ["redis>=5.0"]
llm = ["openai==1.16.2"]
ml = ["sentence-transformers>=2.7", "torch>=2.2"]
evaluation = ["ragas==0.1.7", "datasets>=2.18", "langchain==0.1.16", "langchain-openai==0.1.1", "langchain-community==0.0.32"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10"]
documents = ["pypdf>=4", "python-docx>=1", "python-pptx>=0.6"]
tokenizer = ["tiktoken>=0.7"]
observability = ["opentelemetry-api==1.25.0", "opentelemetry-sdk==1.25.0", "opentelemetry-exporter-otlp-proto-http==1.25.0", "opentelemetry-instrumentation-fastapi==0.46b0", "opentelemetry-instrumentation-httpx==0.46b0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
