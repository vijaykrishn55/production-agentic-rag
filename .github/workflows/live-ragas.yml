name: Live RAGAS Quality Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: Install full evaluation stack
        run: python -m pip install -e ".[dev,postgres,redis,ml,evaluation,documents,tokenizer,observability]"
      - name: Configure local services and provider
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          test -n "$LLM_API_KEY" || (echo "Configure the LLM_API_KEY repository secret" && exit 1)
          {
            echo "APP_ENV=development"
            echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "INTERNAL_SERVICE_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "POSTGRES_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
            echo "LLM_ENABLED=true"
            echo "LLM_API_KEY=$LLM_API_KEY"
            echo "LLM_BASE_URL=https://api.groq.com/openai/v1"
            echo "LLM_MODEL=openai/gpt-oss-20b"
            echo "INSTALL_FEATURES=lite"
            echo "EMBEDDING_BACKEND=hash"
            echo "RERANKER_BACKEND=lexical"
          } > .env
      - name: Start PostgreSQL, Redis, gateway and services
        run: docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health && break
            sleep 5
          done
          curl -fsS http://localhost:8000/ready
      - name: Seed documents
        run: python scripts/seed_documents.py --tenant demo-tenant
      - name: Run live RAGAS gate
        run: python scripts/run_live_evaluation.py --backend ragas --tenant demo-tenant --threshold 0.85 --output reports/live-ragas-evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-ragas-report
          path: reports/live-ragas-evaluation.json
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color > reports/docker-compose.log
