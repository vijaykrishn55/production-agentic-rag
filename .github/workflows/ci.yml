name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install -e ".[dev,tokenizer]"
      - run: python -m pytest -q
      - run: python scripts/security_benchmark.py
      - run: python scripts/evaluate_router.py
      - run: python scripts/run_evaluation.py --backend proxy --threshold 0.85
      - run: python scripts/demo_offline.py
  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          tags: production-agentic-rag:ci
