apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: production-rag
data:
  APP_ENV: "production"
  USE_POSTGRES: "true"
  EMBEDDING_BACKEND: "sentence-transformer"
  EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  RERANKER_BACKEND: "cross-encoder"
  REQUEST_TOKEN_BUDGET: "8192"
  GENERATION_TOKEN_RESERVE: "900"
  EVALUATION_TOKEN_RESERVE: "500"
  MAX_AGENT_ITERATIONS: "3"
  RATE_LIMIT_PER_MINUTE: "50"
  LLM_ENABLED: "true"
  LLM_BASE_URL: "https://api.groq.com/openai/v1"
  LLM_MODEL: "openai/gpt-oss-20b"
  CACHE_ENABLED: "true"
  RAGAS_ENABLED: "true"
  CACHE_BACKEND: "redis"
  SEED_DEMO_DATA: "false"
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: gateway, namespace: production-rag}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: orchestrator, namespace: production-rag}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: retrieval, namespace: production-rag}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: evaluation-worker, namespace: production-rag}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval
  namespace: production-rag
spec:
  replicas: 2
  selector: {matchLabels: {app: retrieval}}
  template:
    metadata: {labels: {app: retrieval}}
    spec:
      serviceAccountName: retrieval
      containers:
        - name: retrieval
          image: ghcr.io/OWNER/production-agentic-rag:IMAGE_TAG
          command: ["uvicorn", "production_rag.services.retrieval_service:app", "--host", "0.0.0.0", "--port", "8002"]
          ports: [{containerPort: 8002}]
          envFrom: [{configMapRef: {name: rag-config}}]
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: production-rag-secrets, key: database-url}}}
            - {name: INTERNAL_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: production-rag-secrets, key: internal-service-token}}}
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "2", memory: "4Gi"}
          readinessProbe: {httpGet: {path: /ready, port: 8002}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8002}, initialDelaySeconds: 30, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: retrieval, namespace: production-rag}
spec:
  selector: {app: retrieval}
  ports: [{name: http, port: 8002, targetPort: 8002}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orchestrator, namespace: production-rag}
spec:
  replicas: 2
  selector: {matchLabels: {app: orchestrator}}
  template:
    metadata: {labels: {app: orchestrator}}
    spec:
      serviceAccountName: orchestrator
      containers:
        - name: orchestrator
          image: ghcr.io/OWNER/production-agentic-rag:IMAGE_TAG
          command: ["uvicorn", "production_rag.services.orchestrator_service:app", "--host", "0.0.0.0", "--port", "8001"]
          ports: [{containerPort: 8001}]
          envFrom: [{configMapRef: {name: rag-config}}]
          env:
            - {name: RETRIEVAL_URL, value: "http://retrieval:8002"}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: production-rag-secrets, key: database-url}}}
            - {name: REDIS_URL, valueFrom: {secretKeyRef: {name: production-rag-secrets, key: redis-url}}}
            - {name: INTERNAL_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: production-rag-secrets, key: internal-service-token}}}
            - {name: LLM_API_KEY, valueFrom: {secretKeyRef: {name: production-rag-secrets, key: llm-api-key}}}
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "2", memory: "4Gi"}
          readinessProbe: {httpGet: {path: /ready, port: 8001}, initialDelaySeconds: 20}
          livenessProbe: {httpGet: {path: /health, port: 8001}, initialDelaySeconds: 30}
---
apiVersion: v1
kind: Service
metadata: {name: orchestrator, namespace: production-rag}
spec:
  selector: {app: orchestrator}
  ports: [{name: http, port: 8001, targetPort: 8001}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: production-rag}
spec:
  replicas: 3
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      serviceAccountName: gateway
      containers:
        - name: gateway
          image: ghcr.io/OWNER/production-agentic-rag:IMAGE_TAG
          command: ["uvicorn", "production_rag.services.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: rag-config}}]
          env:
            - {name: ORCHESTRATOR_URL, value: "http://orchestrator:8001"}
            - {name: RETRIEVAL_URL, value: "http://retrieval:8002"}
            - {name: REDIS_URL, valueFrom: {secretKeyRef: {name: production-rag-secrets, key: redis-url}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: production-rag-secrets, key: jwt-secret}}}
            - {name: INTERNAL_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: production-rag-secrets, key: internal-service-token}}}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "2Gi"}
          readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 30, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 20, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: production-rag}
spec:
  selector: {app: gateway}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gateway, namespace: production-rag}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: evaluation-worker, namespace: production-rag}
spec:
  replicas: 1
  selector: {matchLabels: {app: evaluation-worker}}
  template:
    metadata: {labels: {app: evaluation-worker}}
    spec:
      serviceAccountName: evaluation-worker
      containers:
        - name: evaluation-worker
          image: ghcr.io/OWNER/production-agentic-rag:eval-IMAGE_TAG
          command: ["python", "-m", "production_rag.services.evaluation_worker"]
          envFrom: [{configMapRef: {name: rag-config}}]
          env:
            - {name: ORCHESTRATOR_URL, value: "http://orchestrator:8001"}
            - {name: REDIS_URL, valueFrom: {secretKeyRef: {name: production-rag-secrets, key: redis-url}}}
            - {name: LLM_API_KEY, valueFrom: {secretKeyRef: {name: production-rag-secrets, key: llm-api-key}}}
            - {name: INTERNAL_SERVICE_TOKEN, valueFrom: {secretKeyRef: {name: production-rag-secrets, key: internal-service-token}}}
          resources:
            requests: {cpu: "250m", memory: "1Gi"}
            limits: {cpu: "2", memory: "4Gi"}
